name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      commit:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Go checks (SQLite and PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dscregistry
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: dscregistry_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U dscregistry -d dscregistry_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Check formatting
        shell: bash
        run: |
          mapfile -d '' files < <(git ls-files -z -- '*.go')
          unformatted="$(gofmt -l "${files[@]}")"
          if [[ -n "$unformatted" ]]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Verify modules
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Configure PostgreSQL integration
        shell: bash
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          : "${POSTGRES_PORT:?PostgreSQL service port must be available}"
          printf 'DSCREGISTRY_TEST_POSTGRES_DSN=postgres://dscregistry:ci-only-password@127.0.0.1:%s/dscregistry_test?sslmode=disable\n' "$POSTGRES_PORT" >> "$GITHUB_ENV"
      - name: Test SQLite and PostgreSQL
        shell: bash
        run: |
          : "${DSCREGISTRY_TEST_POSTGRES_DSN:?PostgreSQL integration must be configured}"
          go test -count=1 -timeout=5m -v ./...
      - name: Race test SQLite and PostgreSQL
        run: go test -race -count=1 -timeout=5m -v ./...
      - name: Bounded fuzz smoke tests
        run: |
          go test ./internal/desired -run='^$' -fuzz=FuzzCanonicalJSON -fuzztime=10s -parallel=2
          go test ./internal/report -run='^$' -fuzz=FuzzReportEnvelope -fuzztime=10s -parallel=2

  windows:
    name: Windows HTTP, HTTPS and configuration
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Test CLI, server transports and configuration (SQLite)
        run: go test -count=1 -timeout=3m ./cmd/dscreg ./internal/cli ./internal/client ./cmd/dscregd ./internal/config
      - name: Build
        run: go build ./...

  deployment:
    name: Container ${{ matrix.arch }} (recovery on amd64)
    needs: packages
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      VERSION: ${{ inputs.version || 'v0.0.0' }}
      ARCH: ${{ matrix.arch }}
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      # No run-id: these are the invoking CI/release run's validated packages.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dscregd-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/packages
      - name: Stage the packaged executable
        run: |
          mkdir -p "dist/container/$ARCH"
          tar -xzf "$RUNNER_TEMP/packages/dscregd-$VERSION-linux-$ARCH.tar.gz" \
            --strip-components=2 -C "dist/container/$ARCH" "dscregd-$VERSION-linux-$ARCH/bin/dscregd"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Assemble image from the packaged executable
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: dscregd:verify-${{ matrix.arch }}
      - name: Smoke test default startup and readiness
        run: |
          printf '%s\n' \
            '{"listenAddress":"0.0.0.0:8080","database":{"engine":"sqlite","dsn":"/data/registry.db"},"reportRoot":"/reports"}' \
            > "$RUNNER_TEMP/container.json"
          chmod 0644 "$RUNNER_TEMP/container.json"
          container=$(docker run --detach --platform "linux/$ARCH" \
            --mount "type=bind,source=$RUNNER_TEMP/container.json,target=/etc/dscregd/config.json,readonly" \
            --tmpfs /data:rw,uid=65532,gid=65532,mode=0700 \
            --publish 127.0.0.1::8080 "dscregd:verify-$ARCH")
          trap 'docker rm --force "$container" >/dev/null' EXIT
          address=$(docker port "$container" 8080/tcp)
          curl --fail --silent --show-error --retry 20 --retry-delay 1 \
            --retry-all-errors --max-time 3 "http://$address/health/ready"
      - name: Verify isolated TLS/PostgreSQL deployment and recovery
        if: matrix.arch == 'amd64'
        run: python3 scripts/verify-deployment.py --image dscregd:verify-amd64

  build:
    name: Build Linux ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      CGO_ENABLED: "0"
      GOOS: linux
      GOARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...

  packages:
    name: Package lifecycle
    needs: [checks, windows, build]
    uses: ./.github/workflows/packages.yml
    with:
      version: ${{ inputs.version || 'v0.0.0' }}
      commit: ${{ inputs.commit || github.sha }}
