name: Publish container

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'Bpoe/dsc-registry' && !github.event.release.draft && !github.event.release.prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ github.event.release.tag_name }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      IMAGE: ghcr.io/bpoe/dsc-registry
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate stable release tag
        shell: bash
        run: |
          [[ $VERSION =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
      - name: Download only this published release's Linux archives and checksums
        run: |
          gh release download "$VERSION" --repo "$GH_REPO" --dir "$RUNNER_TEMP/release" \
            --pattern "dscregd-$VERSION-linux-amd64.tar.gz" \
            --pattern "dscregd-$VERSION-linux-arm64.tar.gz" --pattern SHA256SUMS
      - name: Verify checksums and extract existing binaries
        working-directory: ${{ runner.temp }}/release
        run: |
          for arch in amd64 arm64; do
            archive="dscregd-$VERSION-linux-$arch.tar.gz"
            checksum=$(awk -v name="$archive" '$2 == name {print}' SHA256SUMS)
            test -n "$checksum"
            printf '%s\n' "$checksum" | sha256sum --check --strict -
            mkdir -p "$GITHUB_WORKSPACE/dist/container/$arch"
            tar -xzf "$archive" --strip-components=2 \
              -C "$GITHUB_WORKSPACE/dist/container/$arch" "${archive%.tar.gz}/bin/dscregd"
          done
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish the multi-platform image
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
      - name: Report published digest
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          printf 'Published `%s:%s` (`%s@%s`).\n' "$IMAGE" "$VERSION" "$IMAGE" "$DIGEST" \
            >> "$GITHUB_STEP_SUMMARY"
