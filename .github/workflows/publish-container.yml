name: Publish container

on:
  release:
    types: [published]

permissions:
  contents: read

# Hold this lock through alias promotion, regardless of release version/order.
concurrency:
  group: ghcr-dsc-registry-publishing
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    if: github.repository == 'Bpoe/dsc-registry' && !github.event.release.draft && !github.event.release.prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ github.event.release.tag_name }}
      RELEASE_ID: ${{ github.event.release.id }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      IMAGE: ghcr.io/bpoe/dsc-registry
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify published release and tagged source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ $VERSION =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          commit=$(git rev-parse 'HEAD^{commit}')
          test "$(git rev-parse "$GITHUB_SHA^{commit}")" = "$commit"
          git fetch --no-tags origin "refs/tags/$VERSION"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$commit"
          git merge-base --is-ancestor "$commit" origin/main
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" > "$RUNNER_TEMP/release.json"
          jq -e --arg version "$VERSION" \
            '.tag_name == $version and .draft == false and .prerelease == false and .published_at != null' \
            "$RUNNER_TEMP/release.json"
          test "$(gh api "repos/$GH_REPO/releases/tags/$VERSION" --jq .id)" = "$RELEASE_ID"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "COMMIT=$commit" >> "$GITHUB_ENV"
      - name: Download only this published release's Linux archives and checksums
        run: |
          gh release download "$VERSION" --repo "$GH_REPO" --dir "$RUNNER_TEMP/release" \
            --pattern "dscregd-$VERSION-linux-amd64.tar.gz" \
            --pattern "dscregd-$VERSION-linux-arm64.tar.gz" --pattern SHA256SUMS
      - name: Verify checksums and extract existing binaries
        run: |
          for arch in amd64 arm64; do
            python3 packaging/verify-assets.py --directory "$RUNNER_TEMP/release" \
              --version "$VERSION" --stage-container "$arch" --output dist/container
          done
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Assemble AMD64 image from the tagged Dockerfile
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: dscregd:verify-amd64
      - name: Assemble ARM64 image from the tagged Dockerfile
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          load: true
          push: false
          tags: dscregd:verify-arm64
      - name: Verify both archive/image hashes, embedded provenance and runtime
        run: |
          for arch in amd64 arm64; do
            python3 scripts/verify-container.py --image "dscregd:verify-$arch" \
              --directory "$RUNNER_TEMP/release" --version "$VERSION" --commit "$COMMIT" --arch "$arch"
          done
      - name: Versioned image metadata (no implicit moving aliases)
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          context: git
          images: ghcr.io/bpoe/dsc-registry
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.commit }}
      - name: Recheck release identity and tag before publication
        run: |
          git fetch --no-tags origin "refs/tags/$VERSION"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$COMMIT"
          gh api "repos/$GH_REPO/releases/tags/$VERSION" |
            jq -e --argjson id "$RELEASE_ID" \
              '.id == $id and .draft == false and .prerelease == false and .published_at != null'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish versioned multi-platform image (cached assembly, no compilation)
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
      - name: Verify published index and binaries before moving aliases
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw |
            jq -e '[.manifests[].platform | select(.os != "unknown") | "\(.os)/\(.architecture)"] |
              sort == ["linux/amd64", "linux/arm64"]'
          for arch in amd64 arm64; do
            docker pull --platform "linux/$arch" "$IMAGE@$DIGEST"
            python3 scripts/verify-container.py --image "$IMAGE@$DIGEST" \
              --directory "$RUNNER_TEMP/release" --version "$VERSION" --commit "$COMMIT" --arch "$arch"
          done
      - name: Promote eligible aliases under the publishing lock and report digest
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/tags/$VERSION" |
            jq -e --argjson id "$RELEASE_ID" '.id == $id and .draft == false and .prerelease == false'
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          aliases=$(python3 scripts/container-aliases.py "$VERSION" "$RUNNER_TEMP/releases.json")
          tags=("$VERSION" "${VERSION#v}")
          if [[ -n "$aliases" ]]; then
            while IFS= read -r alias; do
              docker buildx imagetools create --tag "$IMAGE:$alias" "$IMAGE@$DIGEST"
              tags+=("$alias")
            done <<< "$aliases"
          fi
          {
            printf '## Published DSC Registry image\n\n`%s@%s`\n\n' "$IMAGE" "$DIGEST"
            printf 'Platforms: `linux/amd64`, `linux/arm64`.\n\nTags:\n'
          } >> "$GITHUB_STEP_SUMMARY"
          for tag in "${tags[@]}"; do
            docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Manifest}}' |
              jq -e --arg digest "$DIGEST" '.digest == $digest'
            printf -- '- `%s:%s`\n' "$IMAGE" "$tag" >> "$GITHUB_STEP_SUMMARY"
          done
