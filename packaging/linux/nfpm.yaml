name: dscregd
arch: ${GOARCH}
platform: linux
version: ${VERSION}
maintainer: Bpoe <Bpoe@users.noreply.github.com>
description: DSC Registry configuration-delivery API server
homepage: https://github.com/Bpoe/dsc-registry
license: MIT
contents:
  - src: ${STAGE_DIR}/dscregd
    dst: /usr/bin/dscregd
    expand: true
    file_info:
      mode: 0755
  - src: ${STAGE_DIR}/dscregd.service
    dst: /usr/lib/systemd/system/dscregd.service
    expand: true
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/licenses/dscregd/LICENSE
    file_info:
      mode: 0644
  - src: README.md
    dst: /usr/share/doc/dscregd/README.md
    file_info:
      mode: 0644
  - src: docs/
    dst: /usr/share/doc/dscregd/docs/
    file_info:
      mode: 0644
  - src: packaging/linux/config.example.json
    dst: /usr/share/doc/dscregd/config.example.json
    file_info:
      mode: 0644
scripts:
  postinstall: packaging/linux/scripts/postinstall
  preremove: packaging/linux/scripts/preremove
  postremove: packaging/linux/scripts/postremove
overrides:
  deb:
    depends: [passwd, systemd]
  rpm:
    depends: [shadow-utils, systemd]
