# Isolated verification only. Not a PostgreSQL HA or NFS provisioning stack.
x-api: &api
  image: ${DSCREGISTRY_DEMO_IMAGE:?supply a prebuilt image to scripts/verify-deployment.py}
  pull_policy: never
  user: ${DSCREGISTRY_DEMO_USER:-65532:65532}
  command:
    - -external-https
    - -listen=0.0.0.0:8080
    - -database-engine=postgres
    - -database-dsn=postgres://registry:demo-only-password@postgres/registry?sslmode=disable
    - -report-root=/reports
    - -read-timeout=5s
    - -write-timeout=5s
    - -probe-timeout=1s
    - -startup-timeout=15s
  volumes:
    - reports:/reports
  ports:
    - "127.0.0.1::8080"
  stop_grace_period: 20s
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: demo-only-password
      POSTGRES_DB: registry
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry -d registry"]
      interval: 2s
      timeout: 2s
      retries: 30
  api1:
    <<: *api
  api2:
    <<: *api
  proxy:
    image: nginx:1.28-alpine
    volumes:
      - ./nginx.demo.conf:/etc/nginx/nginx.conf:ro
      - ${DSCREGISTRY_DEMO_CERT_DIR:?run scripts/verify-deployment.py}:/certs:ro
    ports:
      - "127.0.0.1::8443"
    depends_on:
      - api1
      - api2

volumes:
  database:
  reports:
